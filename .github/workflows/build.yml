    // Komponen Grafik Gelombang Audio Real-Time
    private static class WaveformView extends View {
        private short[] samples = new short;
        private final Paint paint = new Paint();

        public WaveformView(Context context) {
            super(context);
            paint.setColor(Color.parseColor("#4CAF50"));
            paint.setStrokeWidth(4f);
        }

        public void updateAudio(short[] newSamples) {
            this.samples = newSamples.clone();
            postInvalidate();
        }

        @Override
        protected void onDraw(Canvas canvas) {
            super.onDraw(canvas);
            float midY = getHeight() / 2f;
            float stepX = (float) getWidth() / samples.length;
            for (int i = 0; i < samples.length; i++) {
                float amp = (samples[i] / 32768f) * midY * 2.5f;
                canvas.drawLine(i * stepX, midY - amp, i * stepX, midY + amp, paint);
            }
        }
    }

    private void startAfskDecoder() {
        new Thread(() -> {
            int bufferSize = AudioRecord.getMinBufferSize(SAMPLE_RATE,
                    AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
            if (ActivityCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                    != PackageManager.PERMISSION_GRANTED) return;

            AudioRecord recorder = new AudioRecord(MediaRecorder.AudioSource.MIC,
                    SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO,
                    AudioFormat.ENCODING_PCM_16BIT, bufferSize);
            recorder.startRecording();

            short[] buffer = new short[SAMPLES_PER_BIT];
            StringBuilder packetBuilder = new StringBuilder();
            int bitState = 0, currentByte = 0, frameCount = 0;

            while (isListening) {
                int read = recorder.read(buffer, 0, SAMPLES_PER_BIT);
                if (read == SAMPLES_PER_BIT) {
                    if (++frameCount % 15 == 0) waveformView.updateAudio(buffer);

                    int zeroCrossings = 0;
                    for (int i = 1; i < read; i++) {
                        if ((buffer[i - 1] < 0 && buffer[i] >= 0) ||
                            (buffer[i - 1] >= 0 && buffer[i] < 0)) {
                            zeroCrossings++;
                        }
                    }
                    int bit = (zeroCrossings <= 2) ? 1 : 0;

                    if (bitState == 0) {
                        if (bit == 0) { bitState = 1; currentByte = 0; }
