        String mapStatusText = "Peta: bogor.mbtiles (Offline)";
        if (mapFile.exists()) {
            try {
                OfflineTileProvider tileProvider = new OfflineTileProvider(
                        new SimpleRegisterReceiver(this), new File[]{mapFile});
                map.setTileProvider(tileProvider);
            } catch (Exception e) {
                mapStatusText = "Error Peta: " + e.getMessage();
            }
        } else {
            mapStatusText = "File bogor.mbtiles belum ada di Download";
        }

        // Titik awal: Area Tamansari / Kaki Gunung Salak, Bogor
        lastKnownPos = new GeoPoint(-6.648210, 106.762150);
        map.getController().setZoom(14.5);
        map.getController().setCenter(lastKnownPos);

        // Garis Jejak Perjalanan (Polyline Biru)
        trackLine = new Polyline(map);
        trackLine.getOutlinePaint().setColor(Color.parseColor("#2196F3"));
        trackLine.getOutlinePaint().setStrokeWidth(8.0f);
        map.getOverlays().add(trackLine);

        // Pin Penanda Tracker
        trackerMarker = new Marker(map);
        trackerMarker.setPosition(lastKnownPos);
        trackerMarker.setTitle("TRACKER-01 (ESP32)");
        trackerMarker.setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM);
        map.getOverlays().add(trackerMarker);
        root.addView(map);

        // 2. PANEL HEADER GELAP (ATAS)
        LinearLayout topPanel = new LinearLayout(this);
        topPanel.setOrientation(LinearLayout.VERTICAL);
        topPanel.setBackgroundColor(Color.parseColor("#DD1A1F24"));
        topPanel.setPadding(32, 36, 32, 28);

        headerStatus = new TextView(this);
        headerStatus.setText("GPS Tracker HT AFSK   ● MENDENGARKAN (UV-5R)");
        headerStatus.setTextColor(Color.parseColor("#4CAF50"));
        headerStatus.setTextSize(15);
        headerStatus.setTypeface(null, Typeface.BOLD);

        coordText = new TextView(this);
        coordText.setText("Lat: -6.648210, Lon: 106.762150 | Menunggu paket...");
        coordText.setTextColor(Color.WHITE);
        coordText.setTextSize(13);
        coordText.setPadding(0, 10, 0, 0);

        topPanel.addView(headerStatus);
        topPanel.addView(coordText);
        FrameLayout.LayoutParams topParams = new FrameLayout.LayoutParams(
                FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP);
        root.addView(topPanel, topParams);

        // 3. PANEL BAWAH (TOMBOL FOKUS + GELOMBANG AUDIO AFSK)
        LinearLayout bottomContainer = new LinearLayout(this);
        bottomContainer.setOrientation(LinearLayout.VERTICAL);
        bottomContainer.setPadding(24, 0, 24, 24);

        // Tombol Tengah Peta (Center Tracker)
        Button centerBtn = new Button(this);
        centerBtn.setText("⌖ Fokus Tracker");
        centerBtn.setBackgroundColor(Color.WHITE);
        centerBtn.setTextColor(Color.BLACK);
        centerBtn.setOnClickListener(v -> {
            if (lastKnownPos != null) map.getController().animateTo(lastKnownPos);
        });
        LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
        btnParams.gravity = Gravity.END;
        btnParams.setMargins(0, 0, 0, 16);
        bottomContainer.addView(centerBtn, btnParams);

        // Kotak Visualizer Gelombang AFSK
        LinearLayout audioBox = new LinearLayout(this);
        audioBox.setOrientation(LinearLayout.VERTICAL);
        audioBox.setBackgroundColor(Color.parseColor("#E61A1F24"));
        audioBox.setPadding(24, 20, 24, 20);

        TextView waveTitle = new TextView(this);
        waveTitle.setText("DEMODULASI AFSK 1200 BAUD");
        waveTitle.setTextColor(Color.LTGRAY);
        waveTitle.setTextSize(12);
        waveTitle.setGravity(Gravity.CENTER);

        waveformView = new WaveformView(this);
        LinearLayout.LayoutParams waveParams = new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT, 120);

        footerStatus = new TextView(this);
        footerStatus.setText("Sinyal Audio: Siap | " + mapStatusText);
        footerStatus.setTextColor(Color.WHITE);
        footerStatus.setTextSize(12);
        footerStatus.setGravity(Gravity.CENTER);

        audioBox.addView(waveTitle);
        audioBox.addView(waveformView, waveParams);
